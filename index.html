<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PJL Color System</title>
<style>
  @font-face { font-family: "PJL Display"; src: url("fonts/PJLDisplay-Bold.otf") format("opentype"); font-weight: 700; }
  @font-face { font-family: "PJL Sans"; src: url("fonts/PJLSans-Regular.otf") format("opentype"); font-weight: 400; }
  @font-face { font-family: "PJL Sans"; src: url("fonts/PJLSans-Bold.otf") format("opentype"); font-weight: 700; }

  :root {
    --page: #F8F9FA;       /* grey-50 — Web 2.0 --surface-0 */
    --surface: #FFFFFF;
    --ink: #0C2237;        /* navy-500 */
    --ink-muted: #4A627B;  /* navy-300 */
    --rule: #E2E2E8;       /* white-500 */
    --accent: #FF4800;     /* orange-500 */
    --header: #0C2237;
    --header-ink: #F6F6FC;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: #132A3F;      /* navy-475 — Web 2.0 body.dark fill */
      --surface: #001124;   /* navy-800 */
      --ink: #E2E2E8;
      --ink-muted: #90AAC5; /* navy-100 */
      --rule: #4A627B;      /* navy-300 */
      --header: #0C2237;    /* navy-500 */
    }
  }
  :root[data-theme="dark"] {
    --page: #132A3F; --surface: #001124; --ink: #E2E2E8;
    --ink-muted: #90AAC5; --rule: #4A627B; --header: #0C2237;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font: 400 15px/1.5 "PJL Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  code, .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

  header.top {
    background: var(--header);
    color: var(--header-ink);
    padding: 40px 16px 32px;
    border-bottom: 3px solid #CABD98; /* sand-500 */
  }
  .wrap { max-width: 1200px; margin: 0 auto; }
  header.top h1 {
    font: 700 clamp(32px, 6vw, 56px)/1 "PJL Display", "PJL Sans", system-ui, sans-serif;
    margin: 0 0 16px;
    text-transform: uppercase;
    letter-spacing: 0.01em;
  }
  header.top p { margin: 4px 0; color: #B6D1ED; }
  header.top .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  header.top .meta span {
    background: #1B3147; color: #EEF6FF;
    font-size: 13px; padding: 3px 8px;
  }
  .theme-toggle {
    float: right; margin-left: 16px;
    background: transparent; color: var(--header-ink);
    border: 1px solid #4A627B; padding: 6px 12px;
    font: inherit; font-size: 13px; cursor: pointer;
  }

  main { padding: 0 16px 64px; }
  section.group { margin-top: 48px; }
  section.group > h2 {
    font: 700 13px/1 "PJL Sans", system-ui, sans-serif;
    text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--accent);
    margin: 0 0 4px;
  }
  section.group > .group-title {
    font: 700 28px/1.1 "PJL Display", "PJL Sans", system-ui, sans-serif;
    text-transform: uppercase;
    margin: 0 0 20px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--rule);
  }

  .ramp { margin-bottom: 32px; }
  .ramp-head {
    display: flex; flex-wrap: wrap; align-items: baseline;
    gap: 4px 16px; margin-bottom: 10px;
  }
  .ramp-head h3 { margin: 0; font-size: 18px; font-weight: 700; }
  .ramp-head .role { color: var(--ink-muted); }
  .ramp-head code { font-size: 12px; color: var(--ink-muted); }

  .swatches {
    display: grid;
    grid-template-columns: repeat(var(--n), minmax(64px, 1fr));
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .swatch {
    appearance: none; border: 0; margin: 0;
    min-height: 112px;
    padding: 10px 8px;
    display: flex; flex-direction: column; justify-content: space-between;
    text-align: left; cursor: pointer;
    font: inherit; position: relative;
  }
  .swatch .step { font-size: 13px; font-weight: 700; }
  .swatch .hex { font-size: 11px; opacity: 0.85; }
  .swatch.base .step::after { content: " ★"; }
  .swatch.on-light { color: #0C2237; }
  .swatch.on-dark { color: #FFFFFF; }
  .swatch:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; z-index: 1; }
  .swatch.copied .hex::after { content: " ✓ copied"; }

  .solo { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 32px; }
  .solo .swatch { width: 180px; min-height: 96px; }
  .solo .swatch.light-edge { box-shadow: inset 0 0 0 1px var(--rule); }

  table.quick {
    width: 100%; border-collapse: collapse;
    background: var(--surface);
  }
  table.quick th, table.quick td {
    text-align: left; padding: 10px 12px;
    border-bottom: 1px solid var(--rule);
  }
  table.quick th {
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--ink-muted); font-weight: 700;
  }
  table.quick .chip {
    display: inline-block; width: 28px; height: 20px; vertical-align: middle;
    margin-right: 10px; box-shadow: inset 0 0 0 1px rgba(127,127,127,0.25);
  }
  .table-scroll { overflow-x: auto; }

  .hint { color: var(--ink-muted); font-size: 13px; margin-top: 8px; }

  footer { padding: 24px 16px 40px; color: var(--ink-muted); font-size: 13px; border-top: 1px solid var(--rule); }

  @media (max-width: 640px) {
    .swatch { min-height: 96px; }
    .solo .swatch { width: calc(50% - 8px); }
    header.top { padding-top: 28px; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <button class="theme-toggle" type="button" id="themeToggle">Toggle theme</button>
    <h1>PJL Color System</h1>
    <p>13-step OKLCH ramps · Step 500 anchors brand colors · Perceptually uniform L deltas</p>
    <p>Scale direction: light → dark, left → right</p>
    <div class="meta">
      <span>Tokens: color</span>
      <span>semantic/light</span>
      <span>semantic/dark</span>
      <span>Themes: Light, Dark</span>
    </div>
  </div>
</header>

<main class="wrap" id="app"></main>

<footer>
  <div class="wrap">Source: <code>pjl-brand/brand/pjl-color-palette.md</code> · Click any swatch to copy its hex.</div>
</footer>

<script>
const R = (name, role, path, base, steps) => ({ name, role, path, base, steps });
const BRAND_STEPS = ["25","50","100","200","300","400","450","475","500","600","700","800","900","950","1000"];
const STD_STEPS   = ["25","50","100","200","300","400","500","600","700","800","900","950","1000"];

const GROUPS = [
  {
    label: "Group 01", title: "Brand",
    ramps: [
      R("Navy", "Primary", "color.brand.primary", "#0C2237", BRAND_STEPS.map((s, i) => [s, ["#EEF6FF","#B6D1ED","#90AAC5","#6C859F","#4A627B","#2A4158","#1B3147","#132A3F","#0C2237","#061C31","#02162A","#001124","#000B1C","#000714","#00030C"][i]])),
      R("Orange", "Secondary", "color.brand.secondary", "#FF4800", BRAND_STEPS.map((s, i) => [s, ["#FFF2EE","#FFDBD1","#FFC3B3","#FFAA93","#FF8F71","#FF714A","#FF5E30","#FF5420","#FF4800","#D03900","#A42B00","#791D00","#511000","#2C0500","#0D0000"][i]])),
      R("Brown", "Tertiary", "color.brand.tertiary", "#522311", BRAND_STEPS.map((s, i) => [s, ["#FFF2ED","#FEC2AC","#D99F8A","#B67E6A","#935E4B","#72402E","#623120","#5A2A18","#522311","#471907","#3D1000","#300A00","#230500","#170200","#0C0100"][i]])),
      R("Sand", "Accent 1", "color.brand.accent-1", "#CABD98", BRAND_STEPS.map((s, i) => [s, ["#FFF5D8","#F9EBC5","#EFE2BC","#E6D8B3","#DCCFAA","#D3C6A1","#CEC19C","#CCBF9A","#CABD98","#A59975","#827653","#605433","#403514","#221900","#050300"][i]])),
      R("White", "Accent 2 · cool-tinted off-white", "color.brand.accent-2", "#E2E2E8", BRAND_STEPS.map((s, i) => [s, ["#F6F6FC","#F3F3F9","#EFEFF5","#ECECF2","#E9E9EF","#E5E5EB","#E4E4EA","#E3E3E9","#E2E2E8","#B6B6BC","#8C8C92","#65656A","#404044","#1E1E22","#030305"][i]])),
    ]
  },
  {
    label: "Group 02", title: "Neutral",
    solo: [
      ["ab-black", "Absolute Black", "color.ab-black", "#000000"],
      ["ab-white", "Absolute White", "color.ab-white", "#FFFFFF"],
    ],
    ramps: [
      R("Grey", "Neutral", "color.neutral.grey", "#ADB5BD", STD_STEPS.map((s, i) => [s, ["#FDFDFD","#F8F9FA","#F1F3F5","#E9ECEF","#DEE2E6","#CED4DA","#ADB5BD","#868E96","#495057","#343A40","#212529","#121416","#020202"][i]])),
      R("Slate", "Neutral", "color.neutral.slate", "#475569", STD_STEPS.map((s, i) => [s, ["#EFF6FF","#C9DAF2","#ADBED5","#92A2B9","#78879D","#5F6E83","#475569","#384559","#293649","#1B2839","#0E1A2B","#030D1C","#00030F"][i]])),
    ]
  },
  {
    label: "Group 03", title: "Function · Semantic · Decoration",
    ramps: [
      R("Emerald", "Success", "color.emerald", "#15803D", STD_STEPS.map((s, i) => [s, ["#DFFFE4","#97F6AC","#7FDE95","#67C67E","#4EAE68","#359752","#15803D","#00692E","#005222","#003D17","#00280D","#001505","#000501"][i]])),
      R("Amber", "Warning", "color.amber", "#B45309", STD_STEPS.map((s, i) => [s, ["#FFF2EC","#FFD4BE","#FFB48C","#FB9358","#E37E42","#CB682A","#B45309","#923F00","#753200","#572300","#3B1500","#210800","#0A0100"][i]])),
      R("Crimson", "Alert / Error", "color.crimson", "#B91C1C", STD_STEPS.map((s, i) => [s, ["#FFF2F0","#FFCEC7","#FFA89D","#FF7D70","#F0574C","#D53C35","#B91C1C","#9D000B","#7D0006","#5E0003","#410001","#260000","#0E0000"][i]])),
      R("Cobalt", "Info", "color.cobalt", "#155EEF", STD_STEPS.map((s, i) => [s, ["#F0F5FF","#CCDEFF","#A7C7FF","#83AEFF","#5D95FF","#3679FF","#155EEF","#0048D0","#0037A5","#00277D","#001857","#000A34","#00001C"][i]])),
    ]
  }
];

const QUICK = [
  ["Navy", "Brand Primary", "#0C2237"],
  ["Orange", "Brand Secondary", "#FF4800"],
  ["Brown", "Brand Tertiary", "#522311"],
  ["Sand", "Brand Accent 1", "#CABD98"],
  ["White", "Brand Accent 2", "#E2E2E8"],
  ["Black", "Absolute", "#000000"],
  ["White", "Absolute", "#FFFFFF"],
  ["Grey", "Neutral", "#ADB5BD"],
  ["Slate", "Neutral", "#475569"],
  ["Emerald", "Success", "#15803D"],
  ["Amber", "Warning", "#B45309"],
  ["Crimson", "Error / Alert", "#B91C1C"],
  ["Cobalt", "Info", "#155EEF"],
];

// WCAG relative luminance — picks whichever label colour has the higher contrast.
function luminance(hex) {
  const c = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255)
    .map(v => v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4));
  return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
}
function textClass(hex) {
  const L = luminance(hex);
  const onNavy = (L + 0.05) / (luminance("#0C2237") + 0.05);
  const onWhite = 1.05 / (L + 0.05);
  return onNavy >= onWhite ? "on-light" : "on-dark";
}

function swatch(token, hex, isBase, label = token) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = `swatch ${textClass(hex)}${isBase ? " base" : ""}`;
  b.style.background = hex;
  b.title = `${token} · copy ${hex}`;
  b.innerHTML = `<span class="step">${label}</span><span class="hex mono">${hex}</span>`;
  b.addEventListener("click", () => copy(hex, b));
  return b;
}

function copy(hex, el) {
  const done = () => { el.classList.add("copied"); setTimeout(() => el.classList.remove("copied"), 1200); };
  if (navigator.clipboard) navigator.clipboard.writeText(hex).then(done, () => {});
}

const app = document.getElementById("app");
for (const g of GROUPS) {
  const sec = document.createElement("section");
  sec.className = "group";
  sec.innerHTML = `<h2>${g.label}</h2><div class="group-title">${g.title}</div>`;

  if (g.solo) {
    const solo = document.createElement("div");
    solo.className = "solo";
    for (const [token, , , hex] of g.solo) {
      const s = swatch(token, hex, false);
      if (hex === "#FFFFFF") s.classList.add("light-edge");
      solo.appendChild(s);
    }
    sec.appendChild(solo);
  }

  for (const r of g.ramps) {
    const prefix = r.name.toLowerCase();
    const div = document.createElement("div");
    div.className = "ramp";
    div.innerHTML = `<div class="ramp-head"><h3>${r.name}</h3><span class="role">${r.role}</span><code>${r.path}</code><code>base ${r.base}</code></div>`;
    const row = document.createElement("div");
    row.className = "swatches";
    row.style.setProperty("--n", r.steps.length);
    for (const [step, hex] of r.steps) row.appendChild(swatch(`${prefix}-${step}`, hex, step === "500", step));
    div.appendChild(row);
    sec.appendChild(div);
  }
  app.appendChild(sec);
}

const q = document.createElement("section");
q.className = "group";
q.innerHTML = `<h2>Quick reference</h2><div class="group-title">Base (500) Anchors</div>
  <div class="table-scroll"><table class="quick">
    <thead><tr><th>Ramp</th><th>Role</th><th>Base hex</th></tr></thead>
    <tbody>${QUICK.map(([n, role, hex]) =>
      `<tr><td><span class="chip" style="background:${hex}"></span>${n}</td><td>${role}</td><td class="mono">${hex}</td></tr>`).join("")}</tbody>
  </table></div>
  <p class="hint">★ marks the 500 anchor step of each ramp.</p>`;
app.appendChild(q);

const root = document.documentElement;
document.getElementById("themeToggle").addEventListener("click", () => {
  const dark = root.dataset.theme
    ? root.dataset.theme === "dark"
    : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
});
</script>
</body>
</html>
